  - name: 💳 Pagamentos
    meta:
      id: fld_payments_module
      created: 1758233809514
      modified: 1758233809514
      sortKey: -1754253067023
      description: >-
        Sistema de pagamentos com Stripe - Payment Intents e Webhooks

        🔧 CONFIGURAÇÃO FRONTEND:
        1. Instalar Stripe: npm install @stripe/stripe-js @stripe/react-stripe-js
        2. Obter chave publicável do Stripe Dashboard (pk_test_... ou pk_live_...)
        3. Configurar StripeProvider no App.js:
        ```javascript
        import { Elements } from '@stripe/react-stripe-js';
        import { loadStripe } from '@stripe/stripe-js';

        const stripePromise = loadStripe('pk_test_...'); // Sua chave publicável

        function App() {
          return (
            <StripeProvider stripe={stripePromise}>
              {/* Seu app aqui */}
            </StripeProvider>
          );
        }
        ```

        ⚠️ IMPORTANTE: Nunca use chaves secretas no frontend!
        - pk_test_* para desenvolvimento
        - pk_live_* para produção
    children:
      - url: "{{ _.base_url }}/payments/create-intent"
        name: 💳 Criar Payment Intent
        meta:
          id: req_create_payment_intent
          created: 1758233809514
          modified: 1758233809514
          isPrivate: false
          description: >-
            Criar um Payment Intent do Stripe para processar pagamentos.

            FLUXO TÍPICO:
            1. Cliente seleciona pizzas e calcula total
            2. Sistema cria Payment Intent com o valor total
            3. Frontend usa client_secret para processar pagamento
            4. Stripe confirma pagamento via webhook
            5. Sistema atualiza status do pedido para EM_PREPARO

            O valor deve ser enviado em centavos (ex: R$ 75,00 = 7500)

            📱 IMPLEMENTAÇÃO FRONTEND:
            - Quando? Quando o usuário clica em "Ir para Pagamento" ou "Finalizar Pedido" (antes de mostrar a tela de cartão)
            - Por que? O backend precisa do total para criar o Payment Intent no Stripe. O frontend não deve criar intents diretamente
            - Chamada: POST /payments/create-intent com {"amount": 7500}
            - Resposta: Backend retorna client_secret (ex: "pi_xxx_secret_xxx")
            - Próximo passo: Usar client_secret no Stripe Elements para coletar dados do cartão

            📝 EXEMPLO DE CÓDIGO FRONTEND (JavaScript/React):
            ```javascript
            // 1. Calcular total do pedido (em centavos)
            const totalInCents = cartItems.reduce((sum, item) => sum + (item.price * item.quantity * 100), 0);

            // 2. Criar Payment Intent no backend
            const response = await fetch('/api/payments/create-intent', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${userToken}`
              },
              body: JSON.stringify({ amount: totalInCents })
            });

            const { client_secret } = await response.json();

            // 3. Usar client_secret no Stripe Elements
            const stripe = await stripePromise;
            const elements = stripe.elements({ clientSecret: client_secret });

            // 4. Montar elementos de pagamento
            const paymentElement = elements.create('payment');
            paymentElement.mount('#payment-element');
            ```
          sortKey: -1754253067023.1
