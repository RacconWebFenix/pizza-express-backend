      - url: "{{ _.base_url }}/payments/webhook"
        name: 🔗 Webhook Stripe
        meta:
          id: req_stripe_webhook
          created: 1758233809514
          modified: 1758233809514
          isPrivate: false
          description: >-
            Endpoint para receber webhooks do Stripe.

            EVENTOS SUPORTADOS:
            - payment_intent.succeeded: Pagamento confirmado
            - payment_intent.payment_failed: Pagamento falhou

            QUANDO RECEBE payment_intent.succeeded:
            1. Busca pedido pelo paymentIntentId
            2. Atualiza status do pedido para EM_PREPARO
            3. Permite que o restaurante comece a preparar

            Este endpoint é chamado automaticamente pelo Stripe.
          sortKey: -1754253067023.2
        method: POST
        body:
          mimeType: application/json
          text: |-
