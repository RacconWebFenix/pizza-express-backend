    children:
      - url: "{{ _.base_url }}/pedidos/{{ _.pedido_id }}/status"
        name: ✏️ Atualizar Status do Pedido
        meta:
          id: req_7436b8350ceb43259b4397a8444df08b
          created: 1754598765432
          modified: 1754598765432
          isPrivate: false
          description: >-
            Muda o status de um pedido.

            Status válidos: PENDENTE, EM_PREPARO, A_CAMINHO, ENTREGUE,
            CANCELADO.


            A transição deve seguir a lógica de negócio:

            - PENDENTE -> EM_PREPARO ou CANCELADO

            - EM_PREPARO -> A_CAMINHO ou CANCELADO

            - A_CAMINHO -> ENTREGUE

            - ENTREGUE e CANCELADO são estados finais.
          sortKey: -1754253067041.5
        method: PATCH
        body:
          mimeType: application/json
          text: |-
            {
              "status": "A_CAMINHO"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: Bearer {{ _.jwt }}
        scripts:
          preRequest: ""
          afterResponse: ""
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/pedidos"
        name: ➕ Criar Pedido
        meta:
          id: req_6e5d9793a9394be3ac1209c86a69a01f
          created: 1754603552673
          modified: 1754342928422
          isPrivate: false
          description: >-
            Criar um novo pedido com cálculo automático de total baseado nos preços das pizzas.

            FLUXO COMPLETO DE PAGAMENTO:
            1. Cliente seleciona pizzas → calcula total automaticamente
            2. Sistema cria Payment Intent (/payments/create-intent) → retorna client_secret
            3. Frontend processa pagamento com Stripe usando client_secret
            4. Cliente cria pedido incluindo paymentIntentId
            5. Stripe confirma pagamento → webhook atualiza status para EM_PREPARO

            O status inicial será PENDENTE até confirmação do pagamento.
            O campo paymentIntentId é obrigatório para pedidos pagos.
          sortKey: -1754253067040
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "clienteId": {{ _.user_id }},
              "enderecoId": {{ _.endereco_id }},
              "pizzasIds": [{{ _.pizza_id }}, 2, 3],
              "paymentIntentId": "pi_test_payment_intent_abc123",
              "observacoes": "Sem cebola, por favor"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: Bearer {{ _.jwt }}
        scripts:
          preRequest: ""
          afterResponse: ""
        settings:
