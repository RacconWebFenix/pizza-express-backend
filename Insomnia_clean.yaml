        name: ➕ Criar Pedido
        meta:
          id: req_create_order
          created: 1758233809514
          modified: 1758233809514
          isPrivate: false
          description: >-
            Criar um novo pedido com cálculo automático de total baseado nos preços das pizzas.
            O status padrão será PENDENTE se não for especificado.
            O total é calculado automaticamente somando os preços de todas as pizzas selecionadas.
          sortKey: -1754253067040
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "clienteId": 1,
              "enderecoId": 1,
              "pizzasIds": [1, 2],
              "paymentIntentId": "pi_stripe_payment_intent_id"
            }
        headers:
