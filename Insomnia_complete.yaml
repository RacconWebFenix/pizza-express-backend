      - url: "{{ _.base_url }}/pedidos/{{ _.pedido_id }}/status"
        name: ✏️ Atualizar Status do Pedido
        meta:
          id: req_update_order_status
          created: 1758233809514
          modified: 1758233809514
          isPrivate: false
          description: >-
            Muda o status de um pedido.

            Status válidos: PENDENTE, EM_PREPARO, A_CAMINHO, ENTREGUE,
            CANCELADO.


            A transição deve seguir a lógica de negócio:

            - PENDENTE -> EM_PREPARO ou CANCELADO

            - EM_PREPARO -> A_CAMINHO ou CANCELADO

            - A_CAMINHO -> ENTREGUE

            - ENTREGUE e CANCELADO são estados finais.
          sortKey: -1754253067041.5
        method: PATCH
        body:
          mimeType: application/json
          text: |-
            {
              "status": "A_CAMINHO"
            }
        headers:
