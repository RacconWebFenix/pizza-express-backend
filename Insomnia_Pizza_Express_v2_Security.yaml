        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "email": "admin@pizza.com",
              "password": "123456"
            }
        headers:
          - name: Content-Type
            value: application/json
        scripts:
          preRequest: ""
          afterResponse: |-
            const response = JSON.parse(responseBody);
            if (response.access_token) {
              insomnia.environment.set('jwt_admin', response.access_token);
            }
